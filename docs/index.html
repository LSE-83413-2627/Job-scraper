<style>
:root {
  --paper: #EDF0F3;
  --surface: #FFFFFF;
  --ink: #17212B;
  --muted: #586572;
  --line: #D3DAE1;
  --mark: #FFE14D;
  --focus: #2457B8;
  --t-werkstudent: #2457B8;
  --t-praktikum: #0C7457;
  --t-einstieg: #7038B5;
  --t-phd: #A8253B;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #11161C; --surface: #19212A; --ink: #E5EAEF; --muted: #97A3AF;
    --line: #2B3540; --mark: rgba(255, 214, 51, .34); --focus: #8DB2FF;
    --t-werkstudent: #8DB2FF; --t-praktikum: #5FD3A9; --t-einstieg: #C29BF5; --t-phd: #F28C9D;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #11161C; --surface: #19212A; --ink: #E5EAEF; --muted: #97A3AF;
  --line: #2B3540; --mark: rgba(255, 214, 51, .34); --focus: #8DB2FF;
  --t-werkstudent: #8DB2FF; --t-praktikum: #5FD3A9; --t-einstieg: #C29BF5; --t-phd: #F28C9D;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 1rem; line-height: 1.5;

}
.wrap { max-width: 56rem; margin: 0 auto; padding: 0 1.25rem; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }

header.wrap { padding-top: 3.5rem; padding-bottom: 1.75rem; }
h1 {

.lead { color: var(--muted); margin: 0; font-size: 1.05rem; max-width: 60ch; }
.lead strong { color: var(--ink); font-weight: 700; }
.warn { margin: .9rem 0 0; font-size: .92rem; color: var(--t-phd); }

body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);

}
.btn {

  color: var(--ink); background: transparent; border: 1px solid var(--line);

}
.btn[hidden] { display: none; }
.reset-mobil { display: none; }
#toggle-filter { display: none; }
.panel { padding: .25rem 0 1rem; border-bottom: 1px solid var(--line); }
.group { display: grid; grid-template-columns: 7.5rem 1fr; gap: .5rem; align-items: start; padding: .3rem 0; }
.group-label { font-size: .9rem; color: var(--muted); padding-top: .4rem; }
.chips { display: flex; flex-wrap: wrap; gap: .4rem; }
.chip {
  font: inherit; font-size: .9rem; font-weight: 500; cursor: pointer;
  color: var(--muted); background: transparent; border: 1px solid var(--line);
  border-radius: 999px; padding: .35rem .8rem; display: inline-flex; gap: .4rem; align-items: center;
}
.chip .n { font-variant-numeric: tabular-nums; opacity: .75; }
.chip:disabled { opacity: .4; cursor: default; }
.chip[aria-pressed="true"] { color: var(--surface); background: var(--c, var(--ink)); border-color: var(--c, var(--ink)); }
.chip[aria-pressed="true"] .n { opacity: .85; }
.chip.t-werkstudent { --c: var(--t-werkstudent); }
.chip.t-praktikum { --c: var(--t-praktikum); }
.chip.t-einstieg { --c: var(--t-einstieg); }
.chip.t-phd { --c: var(--t-phd); }

:root[data-theme="dark"] .chip[aria-pressed="true"] { color: #11161C; }

section + section { margin-top: 2.25rem; }
h2 { font-size: 1.05rem; font-weight: 700; margin: 0 0 .35rem; display: flex; gap: .5rem; align-items: baseline; }

li.job {

.job-title { font-size: 1.08rem; font-weight: 600; line-height: 1.35; margin: 0; text-decoration: none; }

.meta { grid-column: 1; color: var(--muted); font-size: .93rem; display: flex; flex-wrap: wrap; gap: .1rem .9rem; }
.typ { font-weight: 600; }
.typ.t-werkstudent { color: var(--t-werkstudent); }
.typ.t-praktikum { color: var(--t-praktikum); }
.typ.t-einstieg { color: var(--t-einstieg); }
.typ.t-phd { color: var(--t-phd); }
.side { grid-column: 2; grid-row: 1 / span 2; display: flex; flex-direction: column; align-items: flex-end; gap: .3rem; }
.age { color: var(--muted); font-size: .85rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
.star {

  background: none; border: 1px solid var(--line); border-radius: 6px; padding: .15rem .55rem;

.star[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); font-weight: 600; }

.empty { padding: 3rem 0; color: var(--muted); max-width: 46ch; }
.empty strong { color: var(--ink); display: block; font-size: 1.1rem; margin-bottom: .3rem; }
footer.wrap { color: var(--muted); font-size: .85rem; padding-bottom: 3rem; }

@media (max-width: 34rem) {
  header.wrap { padding-top: 2.25rem; }
  #toggle-filter { display: inline-block; }
  #reset { display: none; }
  .reset-mobil { display: block; margin-top: .6rem; }
  .panel:not(.offen) { display: none; }
  .group { grid-template-columns: 1fr; gap: .3rem; padding: .45rem 0; }
  .group-label { padding-top: 0; }
  li.job { grid-template-columns: 1fr; }
  .side { grid-column: 1; grid-row: auto; flex-direction: row; align-items: center; justify-content: space-between; }
}

const TYPEN = {
  werkstudent: "Werkstudent",
  praktikum: "Praktikum",
  einstieg: "Berufseinstieg",
  phd: "PhD / Forschung",
};
const ZEITEN = { vollzeit: "Vollzeit", teilzeit: "Teilzeit", unbekannt: "Ohne Angabe" };
const MERK_KEY = "studijobs-gemerkt";
const FILTER_KEY = "studijobs-filter";

function regionenVon(j) {
  const r = new Set(j.regionen && j.regionen.length ? j.regionen : ["Weitere Orte"]);
  if (j.remote) r.add("Remote");
  return [...r];
}

// Filtergruppen: innerhalb einer Gruppe ODER, zwischen Gruppen UND
const GRUPPEN = [
  { key: "typ", label: "Jobart", werte: j => [j.typ], optionen: TYPEN, klasse: k => "t-" + k },
  { key: "zeit", label: "Arbeitszeit", werte: j => (j.arbeitszeit && j.arbeitszeit.length ? j.arbeitszeit : ["unbekannt"]), optionen: ZEITEN },
  { key: "region", label: "Region", werte: regionenVon, optionen: null },
];

function lade(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; }
}
function speichere(key, wert) {
  try { localStorage.setItem(key, JSON.stringify(wert)); } catch {}
}

const gespeichert = lade(FILTER_KEY, {});
const state = {
  q: "",
  auswahl: Object.fromEntries(GRUPPEN.map(g => [g.key, new Set(gespeichert[g.key] || [])])),
  nurNeu: false,
  nurGemerkt: false,
  gemerkt: new Set(lade(MERK_KEY, [])),
};

function filterSpeichern() {
  speichere(FILTER_KEY, Object.fromEntries(GRUPPEN.map(g => [g.key, [...state.auswahl[g.key]]])));
}

// Regionen in fester Reihenfolge: wie in der Config, dann Remote und Weitere Orte
(function regionenOptionen() {
  const alle = [];
  for (const j of DATEN.jobs) for (const r of regionenVon(j)) if (!alle.includes(r)) alle.push(r);
  const hinten = ["Remote", "Weitere Orte"];
  const vorne = alle.filter(r => !hinten.includes(r)).sort((a, b) => a.localeCompare(b, "de"));
  GRUPPEN[2].optionen = Object.fromEntries([...vorne, ...hinten.filter(r => alle.includes(r))].map(r => [r, r]));
  // Gespeicherte Auswahl, die es nicht mehr gibt, verwerfen
  for (const g of GRUPPEN) for (const k of [...state.auswahl[g.key]]) if (!(k in g.optionen)) state.auswahl[g.key].delete(k);
})();

const tageZwischen = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);

function alterText(datum, heute) {
  if (!datum) return "";
  const d = tageZwischen(datum, heute);
  if (d <= 0) return "heute online";
  if (d === 1) return "seit gestern";
  return `seit ${d} Tagen`;
}

function gruppe(job, heute) {
  const d = tageZwischen(job.zuerst_gesehen, heute);
  if (d <= 0) return "Heute neu";
  if (d === 1) return "Gestern";
  if (d <= 7) return "Diese Woche";
  return "Früher";
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// Prüft alle Filter, optional ohne eine Gruppe (für die Zahlen an den Chips)
function passt(j, ohneGruppe) {
  const q = state.q.trim().toLowerCase();
  if (q && !`${j.titel} ${j.arbeitgeber} ${j.ort} ${regionenVon(j).join(" ")}`.toLowerCase().includes(q)) return false;
  if (ohneGruppe !== "anzeigen") {
    if (state.nurNeu && j.zuerst_gesehen !== DATEN.heute) return false;
    if (state.nurGemerkt && !state.gemerkt.has(j.id)) return false;
  }
  for (const g of GRUPPEN) {
    if (g.key === ohneGruppe) continue;
    const sel = state.auswahl[g.key];
    if (sel.size && !g.werte(j).some(w => sel.has(w))) return false;
  }
  return true;
}

function aktiveFilter() {
  return GRUPPEN.reduce((n, g) => n + state.auswahl[g.key].size, 0) + state.nurNeu + state.nurGemerkt;
}

function chip(label, n, pressed, cls, onClick) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "chip " + (cls || "");
  b.setAttribute("aria-pressed", pressed);
  b.disabled = !pressed && n === 0;
  b.innerHTML = `${esc(label)} <span class="n">${n}</span>`;
  b.addEventListener("click", onClick);
  return b;
}

function gruppenZeile(label) {
  const row = document.createElement("div");
  row.className = "group";
  row.setAttribute("role", "group");
  row.setAttribute("aria-label", label);
  row.innerHTML = `<div class="group-label">${esc(label)}</div><div class="chips"></div>`;
  return row;
}

function renderFilter() {
  const panel = document.getElementById("panel");
  panel.innerHTML = "";
  for (const g of GRUPPEN) {
    // Nur Optionen zeigen, die im Datenbestand überhaupt vorkommen
    const vorhanden = Object.keys(g.optionen).filter(k => DATEN.jobs.some(j => g.werte(j).includes(k)));
    if (vorhanden.length < (g.key === "typ" ? 1 : 2)) continue;
    const row = gruppenZeile(g.label);
    const box = row.querySelector(".chips");
    const basis = DATEN.jobs.filter(j => passt(j, g.key));
    for (const k of vorhanden) {
      const n = basis.filter(j => g.werte(j).includes(k)).length;
      const sel = state.auswahl[g.key];
      box.append(chip(g.optionen[k], n, sel.has(k), g.klasse ? g.klasse(k) : "", () => {
        sel.has(k) ? sel.delete(k) : sel.add(k);
        filterSpeichern();
        render();
      }));
    }
    panel.append(row);
  }
  const row = gruppenZeile("Anzeigen");
  const box = row.querySelector(".chips");
  const basis = DATEN.jobs.filter(j => passt(j, "anzeigen"));
  box.append(chip("Nur neue", basis.filter(j => j.zuerst_gesehen === DATEN.heute).length, state.nurNeu, "",
    () => { state.nurNeu = !state.nurNeu; render(); }));
  box.append(chip("Gemerkt", basis.filter(j => state.gemerkt.has(j.id)).length, state.nurGemerkt, "",
    () => { state.nurGemerkt = !state.nurGemerkt; render(); }));
  panel.append(row);

  const n = aktiveFilter();
  document.getElementById("reset").hidden = n === 0;
  if (n) {
    const r = document.createElement("button");
    r.type = "button";
    r.className = "btn reset-mobil";
    r.textContent = "Alle Filter zurücksetzen";
    r.addEventListener("click", zuruecksetzen);
    panel.append(r);
  }
  document.getElementById("toggle-filter").textContent = n ? `Filter (${n})` : "Filter";
}

function renderListe() {
  const liste = document.getElementById("list");
  const jobs = DATEN.jobs.filter(j => passt(j));
  if (!DATEN.jobs.length) {
    liste.innerHTML = `<div class="empty"><strong>Noch keine Stellen gefunden.</strong>Prüfe die Suchbegriffe und Orte in der config.yaml und starte den Workflow danach erneut.</div>`;
    return;
  }
  if (!jobs.length) {
    liste.innerHTML = `<div class="empty"><strong>Keine Stelle passt zu diesen Filtern.</strong>Entferne einen Filter oder ändere den Suchtext.</div>`;
    return;
  }
  const reihenfolge = ["Heute neu", "Gestern", "Diese Woche", "Früher"];
  const gruppen = new Map(reihenfolge.map(g => [g, []]));
  for (const j of jobs) gruppen.get(gruppe(j, DATEN.heute)).push(j);

  liste.innerHTML = "";
  for (const [name, items] of gruppen) {
    if (!items.length) continue;
    const sec = document.createElement("section");
    sec.innerHTML = `<h2>${name} <span class="n">${items.length}</span></h2>`;
    const ul = document.createElement("ul");
    ul.className = "jobs";
    for (const j of items) {
      const li = document.createElement("li");
      const istNeu = j.zuerst_gesehen === DATEN.heute;
      li.className = "job" + (istNeu ? " is-new" : "");
      const wo = [j.ort, j.remote ? "Remote möglich" : ""].filter(Boolean).join(", ");
      const zeit = ["vollzeit", "teilzeit"].filter(z => (j.arbeitszeit || []).includes(z)).map(z => ZEITEN[z]).join(" oder ");
      const gemerkt = state.gemerkt.has(j.id);
      li.innerHTML = `
        <a class="job-title" href="${esc(j.url)}" target="_blank" rel="noopener"><span>${esc(j.titel)}</span></a>
        <div class="meta">
          <span class="typ t-${esc(j.typ)}">${esc(TYPEN[j.typ] || j.typ)}</span>
          ${j.arbeitgeber ? `<span>${esc(j.arbeitgeber)}</span>` : ""}
          ${wo ? `<span>${esc(wo)}</span>` : ""}
          ${zeit ? `<span>${esc(zeit)}</span>` : ""}
          <span>über ${esc(j.quelle)}</span>
        </div>
        <div class="side">
          <span class="age">${alterText(j.veroeffentlicht, DATEN.heute)}</span>
          <button class="star" type="button" aria-pressed="${gemerkt}">${gemerkt ? "Gemerkt" : "Merken"}</button>
        </div>`;
      li.querySelector(".star").addEventListener("click", () => {
        state.gemerkt.has(j.id) ? state.gemerkt.delete(j.id) : state.gemerkt.add(j.id);
        speichere(MERK_KEY, [...state.gemerkt]);
        render();
      });
      ul.append(li);
    }
    sec.append(ul);
    liste.append(sec);
  }
}

function renderKopf() {
  const akt = new Date(DATEN.aktualisiert);
  const wann = akt.toLocaleString("de-DE", { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" });
  const neu = DATEN.jobs.filter(j => j.zuerst_gesehen === DATEN.heute).length;
  const neuText = neu === 1 ? "1 davon ist neu" : `${neu} davon sind neu`;
  document.getElementById("lead").innerHTML =
    `<strong>${DATEN.jobs.length} offene Stellen</strong>, ${neuText}. Zuletzt aktualisiert am ${esc(wann)} Uhr.`;
  const kaputt = Object.entries(DATEN.quellen || {}).filter(([, s]) => s !== "ok").map(([n]) => n);
  if (kaputt.length) {
    const w = document.getElementById("warn");
    w.hidden = false;
    w.textContent = `Beim letzten Lauf war nicht vollständig erreichbar: ${kaputt.join(", ")}. Ältere Stellen von dort bleiben deshalb vorerst stehen.`;
  }
  document.getElementById("foot").textContent =
    "Quellen: " + Object.keys(DATEN.quellen || {}).join(", ") + ". Filter und gemerkte Stellen werden nur in diesem Browser gespeichert.";
}

function render() { renderFilter(); renderListe(); }

document.getElementById("q").addEventListener("input", e => { state.q = e.target.value; render(); });
function zuruecksetzen() {
  for (const g of GRUPPEN) state.auswahl[g.key].clear();
  state.nurNeu = state.nurGemerkt = false;
  filterSpeichern();
  render();
}
document.getElementById("reset").addEventListener("click", zuruecksetzen);
document.getElementById("toggle-filter").addEventListener("click", e => {
  const panel = document.getElementById("panel");
  const offen = panel.classList.toggle("offen");
  e.currentTarget.setAttribute("aria-expanded", offen);
});
renderKopf();
render();
</script>
